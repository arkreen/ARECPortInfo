  - kind: ethereum/contract
    name: ArkreenRECBank
    network: matic
    source:
      address: '0xab65900A52f1DcB722CaB2e5342bB6b128630A28'
      abi: ArkreenRECBank
      startBlock: 41157616
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/mappings/ArkreenRECBank.ts
      entities:
        - ARECBank
        - ARTPaymentToken
        - ARTTokenSales
      abis:
        - name: ERC20
          file: ./abis/ERC20.json
        - name: ArkreenRECBank
          file: ./abis/ArkreenRECBank.json
      eventHandlers:
        - event: ARTSold(indexed address,indexed address,uint256,uint256)
          handler: handleARTSold    
        - event: ARTPriceChanged(indexed address,indexed address,uint256)
          handler: handleARTPriceChanged    
        - event: Withdraw(indexed address,indexed address,uint256)
